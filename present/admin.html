<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>プレゼント追加｜AI LIFE</title>
  <link rel="stylesheet" href="present.css">
</head>
<body class="admin-body">
  <header><a class="brand" href="./"><span>AI</span>プレゼント管理</a><a class="small-link" href="./">公開ページを見る</a></header>
  <main class="admin-main">
    <section class="admin-card">
      <p class="eyebrow dark">ADD PRESENT</p><h1>プレゼントを追加</h1>
      <p>動画でお客様に伝えたキーワードと、配布するプロンプトを入力してください。</p>
      <form id="addForm"><label>キーワード<input name="keyword" required minlength="2" placeholder="例：YouTube台本"></label><label>プロンプト<textarea name="prompt" required rows="14" placeholder="配布するプロンプトの文章を貼り付けてください"></textarea></label><button class="primary" type="submit">サイトに追加する</button></form>
      <p id="status" class="status" hidden></p>
    </section>
    <section class="admin-card">
      <p class="eyebrow dark">BULK ADD</p><h2>まとめて追加</h2>
      <p>追加用JSONを選ぶと、登録済みを確認しながら未登録分だけ追加します。途中で止まっても同じファイルで続きから再開できます。</p>
      <form id="bulkForm"><label>追加用JSON<input id="bulkFile" type="file" accept="application/json,.json" required></label><button class="primary" type="submit">未登録分をまとめて追加</button></form>
      <p id="bulkStatus" class="status" hidden></p>
    </section>
    <section class="admin-card setup"><details><summary>初回のみ：接続設定</summary><form id="settingsForm"><label>保存先URL<input name="endpoint" type="url" required></label><label>管理キー<input name="adminKey" type="password" required autocomplete="current-password"></label><button type="submit">設定を保存</button></form></details></section>
    <section class="admin-card"><div class="admin-list-head"><div><p class="eyebrow dark">CURRENT PRESENTS</p><h2>登録済み</h2></div><button id="reload" type="button">更新</button></div><div id="adminList" class="admin-list"><p>接続設定後に表示されます。</p></div></section>
  </main>
  <script src="config.js"></script><script src="admin.js"></script>
</body>
</html>
